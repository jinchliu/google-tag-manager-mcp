name: Release

on:
  push:
    tags: ['v*.*.*']
  # Lets a failed publish be retried against the same tag from the Actions UI.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The tagged commit passes the same gate as main before anything is built.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
          enable-cache: true

      # The tag triggers the release, but pyproject.toml is the version of record;
      # a mismatch would upload a version nobody tagged.
      - name: Check tag against project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short --frozen)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi

      - run: uv build

      # Catches a wheel that builds but cannot be imported, before it reaches PyPI.
      - name: Import the built wheel in a clean environment
        run: |
          uv run --isolated --no-project --with dist/*.whl \
            python -c "import google_tag_manager_mcp as m; print(m.package_version())"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # A workflow_dispatch on a branch still builds and smoke-tests; only a tag publishes.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/google-tag-manager-mcp
    permissions:
      # The OIDC token Trusted Publishing exchanges for a short-lived upload token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
